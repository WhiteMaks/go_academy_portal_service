version: "2"
plugins:
    - name: golang
      wasm:
          url: https://downloads.sqlc.dev/plugin/sqlc-gen-go_1.3.0.wasm
          sha256: e8206081686f95b461daf91a307e108a761526c6768d6f3eca9781b0726b7ec8
sql:
    - engine: "postgresql"
      schema:
          - "./.database/migrations/"
          - "./.database/functions/"
      queries:
          - "./.database/queries/"
      codegen:
          - out: "./autogenerate/database"
            plugin: golang
            options:
                package: "database"
                emit_json_tags: true
                emit_prepared_queries: false
                emit_interface: true
                emit_exact_table_names: false